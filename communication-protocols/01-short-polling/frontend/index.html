<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Polling Demo</title>
</head>
<body>
    <h1>Short Polling Demo</h1>
    <div id="data-container"></div>
</body>
<script>
    const pollData = async () => {
        try {
            const response = await fetch('http://localhost:3000/data');
            const data = await response.json();
            document.getElementById('data-container').innerText = data.data;
        } catch (error) {
            console.error('Error fetching data:', error);
        }
    }

    pollData(); // Initial call to fetch data immediately

    // Poll for data every 5 seconds
    const intervalId = setInterval(pollData, 5000);

    // cleanup on page unload
    window.addEventListener('beforeunload', () => {
        clearInterval(intervalId);
    });
</script>
