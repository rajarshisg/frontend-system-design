<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Long Polling Demo</title>
</head>
<body>
    <h1>Long Polling Demo</h1>
    <div id="data-container"></div>
</body>
<script>
    const pollData = async () => {
        try {
            const response = await fetch(`http://localhost:3000/data?data=${document.getElementById('data-container').innerText}`);
            const data = await response.json();
            document.getElementById('data-container').innerText = data.data;
            pollData();
        } catch (error) {
            console.error('Error fetching data:', error);
        }
    }

    pollData(); // Initial call; pollData re-invokes itself on every response,
                // which is what makes this long polling instead of short polling.
</script>
