<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecureBank</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        h2 { position: absolute; top: 20px; left: 20px; color: #2c3e50; }
        #transfer-btn {
            position: absolute;
            top: 150px;
            left: 60px;
            width: 220px;
            height: 50px;
            font-size: 16px;
            background: #c0392b;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #result { position: absolute; top: 220px; left: 60px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>SecureBank — Account Settings</h2>
    <!-- Identical page to the vulnerable version - nothing here changed.
         The fix for clickjacking lives entirely in the HTTP response
         headers (see server.js), not in this page's markup or CSS. -->
    <button id="transfer-btn">Transfer $10,000</button>
    <p id="result"></p>

    <script>
        document.getElementById('transfer-btn').addEventListener('click', async () => {
            const response = await fetch('/transfer', { method: 'POST' });
            const data = await response.json();
            document.getElementById('result').textContent = data.message;
        });
    </script>
</body>
</html>
